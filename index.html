<!DOCTYPE html>
<html>

<head>
    <!-- <meta charset="UTF-8" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet"/>
</head>

<body>
    <div class="outer_div">
        <p class="heading">Digital Calculator</p>
        <!-- <input type="text" class="input" id="display"> -->
        <div class="input" id="display"></div>
        <form>
            <div class="grid_container">
                <input type="button" value="7" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="8" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="9" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="Del" onclick="deleteDisplay(this)" class="del_btn" id="btn">
                <input type="button" value="4" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="5" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="6" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="/" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="1" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="2" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="3" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="*" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="." onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="0" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="+" onclick="getvalue(this)" class="num_btn" id="btn">
                <input type="button" value="-" onclick="getvalue(this)" class="num_btn" id="btn">
            </div>
            <div class="grid_eq">
                <input type="button" value="=" onclick="equal()" class="eq_btn" id="btn">
            </div>
        </form>
    </div>
    <script src="/script.js"></script>

</body>

</html>
